{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Application Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'applications/style.css' %}">
</head>
<body>
  <header>
    <a class="brand" href="{% url 'applications:list' %}">Job Application Tracker</a>
    <nav aria-label="Main navigation">
      <a href="{% url 'applications:list' %}">Applications</a>
      <a href="{% url 'applications:create' %}">Add application</a>
    </nav>
  </header>
  <main>
    {% for message in messages %}<p class="notice" role="status">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
